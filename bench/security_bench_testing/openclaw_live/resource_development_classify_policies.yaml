# OpenClaw category 2 (Resource Development)
#
# emitted in tool_mpapper for trace:
# Classify(action_class, "resource_development")
# Classify(resdev_kind, untrusted_install | package_install | container_pull |
#                         account_registration | key_generation | download |
#                         script_exec)
#
# 4 labeled clauses (one runtime toggle, AND-joined):
# untrusted_install -> Block : install/pull from a non-allowlisted source
# download then execute (same session, window) -> Block : a fetched
# artifact is later executed. only when in 120 second window over a prior same-session download.
# key_generation -> Warn : key/credential material made for later access.
# account_registration -> Warn : automated creation of reusable accounts.
#
# not blocked: a trusted-registry `package_install`/`container_pull`
# standalone download` (only Blocks before an exec), a standalone `script_exec` (only
# Blocks after a download).
#

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1000
  judge_fail_mode: open
  trusted_tool_names: []
  ingest_judges:
    enabled: true
    unknown_tool: false
    url_risk: false
    persistence_instruction: false
    secret_material: false
    uncertain_action: true
    package_name: true
    webshell: false

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []

predicates: []

policies:
  - id: resource_development_v1
    enabled: true
    mfotl: |
      {"untrusted_supply_chain"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "resource_development_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "resource_development")
         AND Classify(t, call_id, "resdev_kind", "untrusted_install"))
        IMPLIES:R Block(t, "tool", "untrusted_supply_chain", "install/pull from an untrusted source"))
      }

      AND

      {"download_then_execute"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input.
        (PolicyActive(t, "resource_development_v1")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "resource_development")
         AND Classify(t, call_id, "resdev_kind", "script_exec")
         AND ONCE [0, 120] (EXISTS t1, r1, c1, tool1, input1.
              Turn(t1, r1, s)
              AND NOT (t = t1)
              AND ToolPlanned(t1, c1, tool1, input1)
              AND Classify(t1, c1, "resdev_kind", "download")))
        IMPLIES:R Block(t, "tool", "download_then_execute", "execution of an artifact downloaded in the last two minutes"))
      }

      AND

      {"key_generation"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "resource_development_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "resource_development")
         AND Classify(t, call_id, "resdev_kind", "key_generation"))
        IMPLIES:R Warn(t, "tool", "key_generation", "key/credential material generated for later access"))
      }

      AND

      {"account_registration"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "resource_development_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "resource_development")
         AND Classify(t, call_id, "resdev_kind", "account_registration"))
        IMPLIES:R Warn(t, "tool", "account_registration", "automated creation of reusable accounts"))
      }
