# OpenClaw category 11 (Collection)
#
# Collection is local staging or aggregation before exfiltration. No external
# sink is required. The mapper emits:
#   Classify(action_class, "collection")
#   Classify(collection_kind,
#            sensitive_copy | system_config_copy | archive | database_dump |
#            log_dump | screenshot_capture | clipboard_capture | bulk_read)
#
# Policy design:
#   * sensitive_copy -> Block
#   * archive/database/log/system_config staging -> Approve
#   * screenshot/clipboard capture -> Approve
#   * recursive bulk read -> Warn
#   * any collection after a prior gated credential access in the same session
#     and last 120 seconds -> Block
#
# Both sides of the temporal tier require ToolPlanned. Native trace time is
# seconds, so the policy needs no wall-clock builtin or judge.

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1000
  judge_fail_mode: open
  trusted_tool_names: []
  ingest_judges:
    enabled: false
    unknown_tool: false
    url_risk: false
    persistence_instruction: false
    secret_material: false
    uncertain_action: false
    package_name: false
    webshell: false

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []
predicates: []

policies:
  - id: collection_v1
    enabled: true
    mfotl: |
      {"sensitive_staging"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "collection_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "collection")
         AND Classify(t, call_id, "collection_kind", "sensitive_copy"))
        IMPLIES:R Block(t, "tool", "sensitive_staging", "copying credential or secret material into a staging location"))
      }

      AND

      {"bulk_staging"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "collection_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "collection")
         AND (Classify(t, call_id, "collection_kind", "archive")
              OR Classify(t, call_id, "collection_kind", "database_dump")
              OR Classify(t, call_id, "collection_kind", "log_dump")
              OR Classify(t, call_id, "collection_kind", "system_config_copy")))
        IMPLIES:R Approve(t, "tool", "bulk_staging"))
      }

      AND

      {"capture"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "collection_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "collection")
         AND (Classify(t, call_id, "collection_kind", "screenshot_capture")
              OR Classify(t, call_id, "collection_kind", "clipboard_capture")))
        IMPLIES:R Approve(t, "tool", "capture"))
      }

      AND

      {"bulk_read"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "collection_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "collection")
         AND Classify(t, call_id, "collection_kind", "bulk_read"))
        IMPLIES:R Warn(t, "tool", "bulk_read", "recursive reading of many file contents"))
      }

      AND

      {"collection_after_credential"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input.
        (PolicyActive(t, "collection_v1")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "collection")
         AND ONCE [0, 120] (EXISTS t1, r1, c1, tool1, input1.
              PolicyActive(t1, "collection_v1")
              AND Turn(t1, r1, s)
              AND NOT (t = t1)
              AND ToolPlanned(t1, c1, tool1, input1)
              AND Classify(t1, c1, "action_class", "credential_access")))
        IMPLIES:R Block(t, "tool", "collection_after_credential", "data staging follows a credential access in this session"))
      }
