backend:
  chat_llm: anthropic
  judge_backend: openai
  trusted_tool_names: []
runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true
feedback:
  enabled: false
human_approval:
  enabled: true
  timeout_seconds: 1
  on_timeout: block
model_blocklist: []
switches: []
predicates: []
policies:
  - id: provenance_v1
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, p.
        (PolicyActive(t, "provenance_v1")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "exec_path", p)
         AND ONCE [0, 600] (EXISTS t2, r2, c2.
              Turn(t2, r2, s)
              AND Classify(t2, c2, "untrusted_write_path", p)))
        IMPLIES:R Block(t, "tool", "provenance_exec", "executing or sourcing a file written earlier from untrusted external content in this session"))

      AND

      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "provenance_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND (EXISTS a. Classify(t, call_id, "control_artifact_write", a)))
        IMPLIES:R Block(t, "tool", "control_artifact_write", "write to an evaluation, scoring, or enforcer control artifact (agent self-tampering)"))

      AND

      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "provenance_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND (EXISTS a. Classify(t, call_id, "control_artifact_read", a)))
        IMPLIES:R Block(t, "tool", "control_artifact_read", "read of the agent's own system-prompt or instruction file (prompt-intel theft)"))
