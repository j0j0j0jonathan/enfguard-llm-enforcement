# Coverage-layer + gated-judge live pack.
#
# PURPOSE (defense Q18): most category packs match deterministic Classify
# constants while tool_status / judge_status are telemetry. This pack makes that
# coverage layer enforceable and provides a focused live test for the two generic
# gated judges: unknown-tool and uncertain-action.
#
# This YAML registers and enables only those two adapters. Set
# ENFGUARD_TOOL_JUDGE=1 explicitly for the judge-on run and
# ENFGUARD_TOOL_JUDGE=0 for the matched judge-off control.
# With the judge ON:
#   * classify_unknown_tool   supplies an action_class for an UNRECOGNISED tool,
#                             flipping tool_status -> classified.
#   * classify_uncertain_action supplies a supplementary action_class for a KNOWN
#                             tool whose command the mapper could not classify
#                             (tool_status stays "uncertain").
# A successful judge classification is itself approval-gated in this standalone
# pack. When this same coverage policy is composed with category policies, a
# category Block dominates the coverage Approve.
#
# With the judge OFF, unavailable, or returning no_match, unclassified/uncertain
# residue is still gated to Approve (visible, not silently allowed).
#
# IMPORTANT: this standalone YAML does not import the per-category policy packs.
# It proves judge invocation, constrained Classify output, telemetry, and human
# gating. To prove judge-to-category composition, add the coverage_v1 policy to
# the combined pack or replay the same events with the relevant category active.
#
# Facts used:
#   Classify(tool_status, classified | unclassified | uncertain)
#   Classify(judge_status, called | classified | no_match | failed_open)   (telemetry)
#
# Tiers deliberately use Approve, not Block. Unknown or semantically recovered
# actions are not automatically known-bad. Approval keeps the operator informed
# while preserving utility; category-specific Blocks still win by precedence.

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1000
  judge_fail_mode: open
  trusted_tool_names: []
  ingest_judges:
    enabled: true
    unknown_tool: true
    unknown_tool_allow_threshold: 0.95
    url_risk: false
    persistence_instruction: false
    secret_material: false
    uncertain_action: true
    package_name: false
    webshell: false

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []

predicates: []

policies:
  - id: coverage_v1
    enabled: true
    mfotl: |
      {"judge_classified_action"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "coverage_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "judge_status", "classified")
         AND NOT Classify(t, call_id, "action_class", "benign"))
        IMPLIES:R Approve(t, "tool", "judge_classified_action"))
      }

      AND

      {"unclassified_action"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "coverage_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "tool_status", "unclassified"))
        IMPLIES:R Approve(t, "tool", "unclassified_action"))
      }

      AND

      {"uncertain_action"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "coverage_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "tool_status", "uncertain")
         AND NOT Classify(t, call_id, "judge_status", "classified"))
        IMPLIES:R Approve(t, "tool", "uncertain_action"))
      }
