# OpenClaw category 9 (Discovery)
#
# Fully classify-first: the mapper emits path_confinement, path_sensitivity,
# action_class, and discovery_kind facts before policy evaluation. 
# no Python or LLM predicates.

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1000
  judge_fail_mode: open
  trusted_tool_names: []
  ingest_judges:
    enabled: false
    unknown_tool: false
    url_risk: false
    persistence_instruction: false
    secret_material: false
    uncertain_action: false
    package_name: false
    webshell: false

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []
predicates: []

policies:
  - id: discovery_v2
    enabled: true
    mfotl: |
      {"path_confinement"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "discovery_v2")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "path_confinement", "escape"))
        IMPLIES:R Block(t, "tool", "path_confinement", "file path resolves outside workspace"))
      }

      AND

      {"credential_discovery"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "discovery_v2")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "path_sensitivity", "credentials")
         AND (Classify(t, call_id, "tool_family", "search")
              OR Classify(t, call_id, "tool_family", "shell")))
        IMPLIES:R Block(t, "tool", "credential_discovery", "search/command targets credential or secret files"))
      }

      AND

      {"credential_file_access"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "discovery_v2")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "path_sensitivity", "credentials")
         AND Classify(t, call_id, "tool_family", "file"))
        IMPLIES:R Approve(t, "tool", "credential_file_access"))
      }

      AND

      {"discovery_accumulation_warn"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input.
        (PolicyActive(t, "discovery_v2")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "discovery")
         AND (EXISTS dcnt.
              dcnt <- CNT(t2; s;
                   ONCE [0, 120] (EXISTS r2, c2, tool2, input2.
                        PolicyActive(t2, "discovery_v2")
                        AND Turn(t2, r2, s)
                        AND ToolPlanned(t2, c2, tool2, input2)
                        AND Classify(t2, c2, "action_class", "discovery")))
              AND dcnt >= 3
              AND dcnt < 5))
        IMPLIES:R Warn(t, "tool", "discovery_accumulation", "three or four discovery probes within two minutes"))
      }

      AND

      {"discovery_accumulation_block"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input.
        (PolicyActive(t, "discovery_v2")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "action_class", "discovery")
         AND (EXISTS dcnt.
              dcnt <- CNT(t2; s;
                   ONCE [0, 120] (EXISTS r2, c2, tool2, input2.
                        PolicyActive(t2, "discovery_v2")
                        AND Turn(t2, r2, s)
                        AND ToolPlanned(t2, c2, tool2, input2)
                        AND Classify(t2, c2, "action_class", "discovery")))
              AND dcnt >= 5))
        IMPLIES:R Block(t, "tool", "discovery_accumulation", "five or more discovery probes within two minutes"))
      }

  # I wanted to test if surpression also works, this is test, currently disabled.
  # enable this policy so the trace contains suppress: ToolPlanned rather than a
  # caused Block verdict.
  - id: discovery_suppression_demo
    enabled: false
    mfotl: |
      {"suppress_path_escape"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "discovery_suppression_demo")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "path_confinement", "escape"))
        IMPLIES:L FALSE)
      }
