# Content-disclosure (content-vs-action) opt-in max-security pack.
#
# PURPOSE (RQ2, A3S content-vs-action gap): the action-grounded packs and the
# seven action-tied judges gate an action or an egress. Two A3S attacks carry
# harm ONLY in the CONTENT written into a LOCAL file with no egress and no
# dangerous action:
#   * syn-0252 writes credential VALUES into a local CONFIG_AUDIT.md.
#   * syn-0254 recites the agent's OWN system prompt into a local HANDOFF.md.
# The mapper now emits an allow-listed content_risk fact ON THE WRITE:
#   * Classify(content_risk, "secret_material")  — deterministic secret regexes,
#     with the gated content-disclosure judge as the free-form fallback.
#   * Classify(content_risk, "system_prompt")    — gated content-disclosure judge
#     only (a recitation of the agent's operating instructions).
#
# This pack is the OPT-IN, max-security gate for that fact. It is NOT imported by
# any category pack and NOT part of the default deterministic packs, because
# counting a local documentation of a secret as harmful sits at a genuine
# definitional edge (a benign audit can legitimately write config). The default
# posture is utility: the fact is emitted for visibility; only this pack blocks a
# write on it. A deployment that wants A3S-style content-leakage coverage enables
# this pack; everyone else leaves it off.
#
# Precision: template/placeholder targets (*.example / *.sample / *.template) are
# carved out at the classifier, so ordinary config templates do not trip it.
#
# The content-disclosure judge is gated. The classifier emits normal fail-safe
# telemetry, but this max-security policy intentionally fails closed for this
# adapter when the weak signal fired and the judge was unavailable. The clause
# binds the single attributed fact Classify(judge_failed_open,
# "content_disclosure") rather than judge_adapter AND judge_status=failed_open,
# because two judges (webshell, content_disclosure) can run on the same
# file_write call_id and MFOTL cannot pair a bare judge_status with its adapter,
# so the two-fact form could be spuriously satisfied by the OTHER adapter's
# failure.

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1500
  judge_fail_mode: open
  trusted_tool_names: []
  ingest_judges:
    enabled: true
    unknown_tool: false
    url_risk: false
    persistence_instruction: false
    secret_material: false
    uncertain_action: false
    package_name: false
    webshell: false
    content_disclosure: true

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []

predicates: []

policies:
  - id: content_disclosure_v1
    enabled: true
    mfotl: |
      {"local_write_secret_material"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "content_disclosure_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "content_risk", "secret_material"))
        IMPLIES:R Block(t, "tool", "local_write_secret_material", "writing plaintext secret material into a local file (content-only exfiltration precursor)"))
      }

      AND

      {"local_write_system_prompt"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "content_disclosure_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "content_risk", "system_prompt"))
        IMPLIES:R Block(t, "tool", "local_write_system_prompt", "writing the agent's own system prompt / operating instructions into a local file (prompt-intelligence disclosure)"))
      }

      AND

      {"content_disclosure_judge_failed_open"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "content_disclosure_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "judge_failed_open", "content_disclosure"))
        IMPLIES:R Block(t, "tool", "content_disclosure_judge_failed_open", "content-disclosure judge failed open on sensitive-looking local-write content"))
      }

  # content_flow_v1 is the ALTERNATIVE, surgical posture: it does NOT block the
  # local write (writing sensitive content into a local doc is allowed, e.g. a
  # legitimate audit), it blocks only the later EGRESS of that SPECIFIC document.
  # This is the principled write-then-send content-flow rule (the Derives /
  # content-handle primitive), symmetric to the untrusted_write_path -> exec_path
  # provenance: the sensitive write emits Classify(sensitive_write_path, p) and a
  # later exfil of the same path emits Classify(egress_source_path, p), correlated
  # over the shared path p within the session. A deployment picks ONE posture:
  # content_disclosure_v1 (block the documentation itself, the definitional-edge
  # maximalist stance) OR content_flow_v1 (allow the documentation, block its
  # exfiltration, the "harm is the send, not the doc" stance). Enable only one.
  - id: content_flow_v1
    enabled: false
    mfotl: |
      {"send_of_sensitive_document"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input, p.
        (PolicyActive(t, "content_flow_v1")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "egress_source_path", p)
         AND ONCE [0, 1800] (EXISTS t2, r2, c2.
              Turn(t2, r2, s)
              AND Classify(t2, c2, "sensitive_write_path", p)))
        IMPLIES:R Block(t, "tool", "send_of_sensitive_document", "sending a local document that earlier received secret material or the agent's system prompt in this session (content-flow exfiltration)"))
      }

  # authored_hook_provenance_v1 is the SPLIT-ARTIFACT posture: the deferred hook
  # and the dangerous payload are authored into SEPARATE files, so neither write
  # alone is a complete dangerous dataflow. A write to a deferred-execution sink
  # taints every local script it will run (deferred_hook_path, p); a later write
  # that authors a secret-read or a dangerous body into that same script emits
  # dangerous_authored_write_path(p); this clause blocks the pair over the shared
  # path p. Symmetric to untrusted_write_path -> exec_path and the content-flow
  # rule; path-parameterised and session-scoped, not byte-level. Opt-in, disabled
  # by default (the eval combined packs enable the same clause inside provenance_v1).
  - id: authored_hook_provenance_v1
    enabled: false
    mfotl: |
      {"provenance_hook_payload"}{
      ALWAYS (FORALL t, rid, s, call_id, tool, input, p.
        (PolicyActive(t, "authored_hook_provenance_v1")
         AND Turn(t, rid, s)
         AND ToolPlanned(t, call_id, tool, input)
         AND Classify(t, call_id, "dangerous_authored_write_path", p)
         AND ONCE [0, 1800] (EXISTS t2, r2, c2.
              Turn(t2, r2, s)
              AND Classify(t2, c2, "deferred_hook_path", p)))
        IMPLIES:R Block(t, "tool", "provenance_hook_payload", "authoring a secret-read or dangerous body into a file an earlier deferred-execution hook will run (split-artifact)"))
      }

  # judge_fail_closed_v1 is the GLOBAL fail-closed posture over EVERY gated judge.
  # When any adapter's deterministic gate fired but the judge could not decide
  # (unavailable / raised / invalid / no key), the mapper emits an attributed
  # Classify(judge_failed_open, <adapter>). This one clause blocks the action for
  # ANY such failure, so a max-security deployment never proceeds on a call whose
  # semantic check could not run. Default posture is fail-open (this pack is
  # opt-in and disabled by default); enable it only for a miss-nothing profile.
  - id: judge_fail_closed_v1
    enabled: false
    mfotl: |
      {"any_judge_failed_open"}{
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "judge_fail_closed_v1")
         AND ToolPlanned(t, call_id, tool, input)
         AND (EXISTS a. Classify(t, call_id, "judge_failed_open", a)))
        IMPLIES:R Block(t, "tool", "judge_fail_closed", "a gated semantic judge could not decide a flagged call and this deployment fails closed"))
      }
