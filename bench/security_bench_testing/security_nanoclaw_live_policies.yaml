# Live NanoClaw security demo policy pack.
#
# This pack is for manual WhatsApp/NanoClaw integration tests. It uses only
# deterministic Python predicates and builtins so the run measures the
# NanoClaw -> EnfGuard tool boundary, not LLM-judge quality.

backend:
  chat_llm: anthropic
  judge_backend: openai
  judge_timeout_ms: 1000
  judge_fail_mode: open
  trusted_tool_names: []

runtime:
  judge_strategy: "off"
  judge_call_mode: batched
  trace_assistant_content: true

feedback:
  enabled: false

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

model_blocklist: []
switches: []

predicates:
  - name: wall_ms_within
    kind: builtin

  - name: outside_workspace_path
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: input
        type: string

  - name: command_writes_outside_workspace
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: input
        type: string

  - name: writes_approval_demo_folder
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: input
        type: string

  - name: risky_tool
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: tool
        type: string

  - name: external_sink
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: tool
        type: string
      - name: input
        type: string

  - name: suspicious_external_sink
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: tool
        type: string
      - name: input
        type: string

  - name: instructional_tool_result
    kind: python
    path: security_nanoclaw_live_predicates.py
    args:
      - name: content
        type: string

policies:
  - id: live_block_destructive_bash
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, call_id, input.
        (PolicyActive(t, "live_block_destructive_bash")
         AND ToolPlanned(t, call_id, "bash", input)
         AND Classify(t, call_id, "command_risk", "critical"))
        IMPLIES:R Block(t, "tool", "command", "destructive shell command refused"))

  - id: live_block_workspace_escape
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, call_id, tool, input.
        (PolicyActive(t, "live_block_workspace_escape")
         AND ToolPlanned(t, call_id, tool, input)
         AND (tool = "file_read" OR tool = "file_write" OR tool = "file_delete")
         AND outside_workspace_path(input) > 0.5)
        IMPLIES:R Block(t, "tool", "path_confinement", "path outside workspace"))

  # Translation of the proposal sketch:
  # ALWAYS NOT (ToolCall("command-line", cmd)
  #   AND "{cmd} can modify a file outside ~/.workspace")
  # Current v4 live form observes the pre-effect Bash plan and delegates
  # the semantic file-effect question to a deterministic Python predicate.
  - id: live_block_proposal_command_workspace_escape
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, call_id, input.
        (PolicyActive(t, "live_block_proposal_command_workspace_escape")
         AND ToolPlanned(t, call_id, "bash", input)
         AND command_writes_outside_workspace(input) > 0.5)
        IMPLIES:R Block(t, "tool", "proposal_workspace_escape", "command can modify a file outside workspace"))

  - id: live_approve_credentials_read
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, call_id, input.
        (PolicyActive(t, "live_approve_credentials_read")
         AND ToolPlanned(t, call_id, "file_read", input)
         AND outside_workspace_path(input) <= 0.5
         AND Classify(t, call_id, "path_sensitivity", "credentials"))
        IMPLIES:R Approve(t, "tool", "agent wants to read a credentials-like file"))

  - id: live_approve_demo_write
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, call_id, input.
        (PolicyActive(t, "live_approve_demo_write")
         AND ToolPlanned(t, call_id, "file_write", input)
         AND writes_approval_demo_folder(input) > 0.5)
        IMPLIES:R Approve(t, "tool", "agent wants to write under approval-demo"))

  - id: live_block_sensitive_external_sink
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, ms_now.
        (PolicyActive(t, "live_block_sensitive_external_sink")
         AND Turn(t, rid, s)
         AND Clock(t, "tool", ms_now)
         AND ToolPlanned(t, call_id, tool, input)
         AND external_sink(tool, input) > 0.5
         AND ONCE [1, 1000] (EXISTS t1, rid1, read_call, read_input, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "tool", ms1)
           AND ToolPlanned(t1, read_call, "file_read", read_input)
           AND Classify(t1, read_call, "path_sensitivity", "credentials")
           AND wall_ms_within(ms_now, ms1, 3600000) > 0.5))
        IMPLIES:R Block(t, "tool", "sensitive_exfiltration", "sensitive read precedes external sink"))

  - id: live_block_untrusted_instruction_to_risky_tool
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, ms_now.
        (PolicyActive(t, "live_block_untrusted_instruction_to_risky_tool")
         AND Turn(t, rid, s)
         AND Clock(t, "tool", ms_now)
         AND ToolPlanned(t, call_id, tool, input)
         AND risky_tool(tool) > 0.5
         AND ONCE [1, 1000] (EXISTS t1, rid1, result_call, content, exit_code, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "tool", ms1)
           AND ToolResult(t1, result_call, content, exit_code)
           AND Untrusted(t1, "tool_result")
           AND instructional_tool_result(content) > 0.5
           AND wall_ms_within(ms_now, ms1, 3600000) > 0.5))
        IMPLIES:R Block(t, "tool", "untrusted_authorization", "risky tool follows instruction-like untrusted tool result"))

  - id: live_block_untrusted_to_privileged_tool_strict
    enabled: false
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, ms_now.
        (PolicyActive(t, "live_block_untrusted_to_privileged_tool_strict")
         AND Turn(t, rid, s)
         AND Clock(t, "tool", ms_now)
         AND ToolPlanned(t, call_id, tool, input)
         AND risky_tool(tool) > 0.5
         AND ONCE [1, 1000] (EXISTS t1, rid1, result_call, content, exit_code, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "tool", ms1)
           AND ToolResult(t1, result_call, content, exit_code)
           AND Untrusted(t1, "tool_result")
           AND wall_ms_within(ms_now, ms1, 3600000) > 0.5))
        IMPLIES:R Block(t, "tool", "untrusted_authorization", "privileged tool follows untrusted tool result (strict)"))

  - id: live_warn_repeated_tool_burst_3_in_30s
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, ms_now.
        (PolicyActive(t, "live_warn_repeated_tool_burst_3_in_30s")
         AND Turn(t, rid, s)
         AND Clock(t, "tool", ms_now)
         AND ToolPlanned(t, call_id, tool, input)
         AND ONCE [1, 1000] (EXISTS t1, rid1, call1, input1, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "tool", ms1)
           AND ToolPlanned(t1, call1, tool, input1)
           AND wall_ms_within(ms_now, ms1, 30000) > 0.5
           AND ONCE [1, 1000] (EXISTS t2, rid2, call2, input2, ms2.
             Turn(t2, rid2, s)
             AND Clock(t2, "tool", ms2)
             AND ToolPlanned(t2, call2, tool, input2)
             AND wall_ms_within(ms_now, ms2, 30000) > 0.5)))
        IMPLIES:R Warn(t, "tool", "tool_pressure", "three same-tool plans within thirty seconds"))

  - id: live_block_risky_after_prior_tool_block
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, rid, s, call_id, tool, input, ms_now.
        (PolicyActive(t, "live_block_risky_after_prior_tool_block")
         AND Turn(t, rid, s)
         AND Clock(t, "tool", ms_now)
         AND ToolPlanned(t, call_id, tool, input)
         AND risky_tool(tool) > 0.5
         AND ONCE [1, 1000] (EXISTS t1, rid1, phase, category, reason, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "tool", ms1)
           AND Block(t1, phase, category, reason)
           AND wall_ms_within(ms_now, ms1, 3600000) > 0.5))
        IMPLIES:R Block(t, "tool", "post_block_escalation", "risky tool within one hour after prior tool block"))
