# Company Safe: protect company data and professional communication.

backend:
  chat_llm: openai
  judge_backend: openai
  judge_openai_model: gpt-4o-mini
  judge_timeout_ms: 5000
  judge_fail_mode: closed

model_blocklist:
  - gpt-4.5-preview
  - claude-3-opus

switches:
  - id: require_sensitive_output_approval
    kind: boolean
    label: "Require sensitive output approval"
    default: true

predicates:
  - name: contains_secrets
    kind: builtin
  - name: model_blocklist
    kind: builtin
  - name: confidential_information
    kind: llm_judge
    inputs:
      - source: Message
        arg: content
      - source: Completion
        arg: content
    system_prompt: |
      Score 1.0 only for confidential company information, customer data,
      credentials, legal/HR/financial content, or private internal details.
      Score 0.0 otherwise.
    on_fail: closed
  - name: professional_tone
    kind: llm_judge
    inputs:
      - source: Completion
        arg: content
    system_prompt: |
      Score 1.0 when the response is not suitable for professional,
      customer-facing business communication. Score 0.0 otherwise.
    on_fail: warn

policies:
  - id: block_secrets_in_prompt
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, c, n.
        (PolicyActive(t, "block_secrets_in_prompt")
         AND Message(t, "user", c, n)
         AND contains_secrets(c) > 0.5)
        IMPLIES Block(t, "request", "secrets", "prompt contains a secret"))

  - id: block_blocklisted_models
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, provider, model.
        (PolicyActive(t, "block_blocklisted_models")
         AND ModelSelection(t, provider, model)
         AND model_blocklist(model) > 0.5)
        IMPLIES Block(t, "request", "model", "model is not approved"))

  - id: approve_sensitive_output
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, c, n.
        (PolicyActive(t, "approve_sensitive_output")
         AND Completion(t, c, n)
         AND SettingBool(t, "require_sensitive_output_approval", 1)
         AND confidential_information(c) > 0.5)
        IMPLIES Approve(t, "request", "Release sensitive company output?"))

  - id: warn_unprofessional_output
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, c, n.
        (PolicyActive(t, "warn_unprofessional_output")
         AND Completion(t, c, n)
         AND professional_tone(c) > 0.5)
        IMPLIES Warn(t, "response", "style", "response may not match company style"))
