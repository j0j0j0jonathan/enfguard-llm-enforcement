[project]
name = "enfguard-v2"
version = "0.1.0"
description = "Runtime enforcement proxy for chat LLM applications using EnfGuard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools]
packages = ["instrlib"]
py-modules = [
    "batch_judge",
    "chat_text",
    "config",
    "event_schema",
    "feedback",
    "handlers",
    "mappings",
    "predicates",
    "proxy",
    "static_analysis",
    "switch_state",
    "yaml_loader",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
