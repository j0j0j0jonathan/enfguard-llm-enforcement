# EnfGuard v4 starter configuration.
#
# Keep this file small. It shows one clean example of each main capability:
# settings, Python predicates, LLM judges, warn/block verdicts, and a
# wall-clock temporal policy. Copy larger scenarios from `examples/` when
# you need them.

backend:
  chat_llm: openai
  judge_backend: openai
  judge_openai_model: gpt-4o-mini
  judge_ollama_model: qwen2.5:0.5b
  judge_anthropic_model: claude-3-5-haiku-latest
  judge_timeout_ms: 3000
  judge_fail_mode: closed
  # Tools whose results are NOT tagged Untrusted. Anything web-facing or
  # filesystem-reading should stay off this list.
  trusted_tool_names: []

feedback:
  enabled: true

runtime:
  judge_batching: conservative
  trace_assistant_content: true
  judge_strategy: active_policy   # off | all_firing | active_policy | guard_aware
  judge_call_mode: batched        # batched | parallel


model_blocklist: []

switches:
  - id: max_prompt_tokens
    kind: int
    label: "Max prompt tokens"
    default: 1200
    min: 100
    max: 8000

  - id: monitor_business_terms
    kind: boolean
    label: "Monitor business terms"
    default: true

  - id: enforcement_mode
    kind: choice
    label: "Enforcement mode"
    options: [audit, warn, enforce]
    default: enforce

human_approval:
  enabled: true
  timeout_seconds: 60
  on_timeout: block

predicates:
  - name: wall_ms_within
    kind: builtin

  - name: mentions_invoice
    kind: python
    path: ./examples/demo_predicates.py
    args:
      - name: content
        type: string

  - name: risky_request
    kind: llm_judge
    backend: openai
    model: gpt-4o-mini
    timeout_ms: 5000
    inputs:
      - source: Message
        arg: content
    system_prompt: |
      Return 1 only if the user asks for clearly unsafe behavior, credential
      leakage, prompt bypass, or instructions for wrongdoing. Return 0 for
      ordinary questions, greetings, benign business text, safety discussion,
      or harmless text.
    on_fail: closed

  - name: religion_classifier
    kind: llm_judge
    timeout_ms: 10000
    inputs:
      - source: Message
        arg: content
    system_prompt: |
      Return 1 only if the user asks about religious belief,
      or religious practice. Return 0 for
      greetings, unrelated text, or a passing mention of religion.
    on_fail: closed

policies:
  - id: warn_business_terms
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, c, n.
        (PolicyActive(t, "warn_business_terms")
         AND Message(t, "user", c, n)
         AND SettingBool(t, "monitor_business_terms", 1)
         AND mentions_invoice(c) > 0.5)
        IMPLIES Warn(t, "request", "business", "message mentions invoice or IBAN"))

  - id: block_risky_requests
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, c, n.
        (PolicyActive(t, "block_risky_requests")
         AND Message(t, "user", c, n)
         AND risky_request(c) > 0.5)
        IMPLIES Block(t, "request", "safety", "request looks unsafe"))

  - id: rate_limit_2_requests_3min
    enabled: true
    mfotl: |
      ALWAYS (FORALL t, s, rid, ms_now.
        (PolicyActive(t, "rate_limit_2_requests_3min")
         AND Turn(t, rid, s)
         AND Clock(t, "request", ms_now)
         AND ONCE [1, 1000] (EXISTS t1, rid1, ms1.
           Turn(t1, rid1, s)
           AND Clock(t1, "request", ms1)
           AND PolicyActive(t1, "rate_limit_2_requests_3min")
           AND wall_ms_within(ms_now, ms1, 180000) > 0.5
           AND ONCE [1, 1000] (EXISTS t2, rid2, ms2.
             Turn(t2, rid2, s)
             AND Clock(t2, "request", ms2)
             AND PolicyActive(t2, "rate_limit_2_requests_3min")
             AND wall_ms_within(ms_now, ms2, 180000) > 0.5)))
        IMPLIES Block(t, "request", "rate_limit", "max 2 requests per 3 minutes"))
